name: Generate Stats SVGs

# Regenerates the self-hosted stats/langs/streak/header SVGs so the profile never
# depends on rate-limited third-party image services (github-readme-stats etc.).
# Uses the built-in GITHUB_TOKEN — nothing to configure.
on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # allow manual runs
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node .github/scripts/gen-stats.mjs

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "No changes to stats SVGs."
          else
            git commit -m "chore: refresh stats SVGs [skip ci]"
            git push
          fi
